services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fitness-tracker-ui
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "1"
#      NUXT_SESSION_PASSWORD: Sup3rS3cr37P4ssw0rdW1thAtL34st32Chars
      FITNESS_TRACKER_API_BASE_URL: http://localhost:8080/api
    volumes:
      - ./app:/app
      # Keep container's node_modules and Nuxt build outputs separate from host
      - /app/node_modules
      - /app/.nuxt
    command: npm run dev -- --host 0.0.0.0
